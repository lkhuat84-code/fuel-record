<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fuel Log · 打油记录</title>

<!-- PWA / 全屏 App 相关 -->
<meta name="theme-color" content="#e65100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
 :root{ --bar:60px; --brand:#e65100 }
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html,body{height:100%;overflow:hidden;background:var(--brand);font-family:-apple-system,Segoe UI,Roboto,sans-serif}

 /* 全屏容器 */
 .wrap{position:fixed;inset:0;overflow:hidden;background:var(--brand)}

 /* iframe 向上偏移 --bar，把 Google 强制的蓝色提示条顶出可视区；
    高度加 --bar，保证页面底部（提交按钮）正好贴住屏幕底部 */
 #app{
   position:absolute;
   top:calc(-1 * var(--bar));
   left:0;
   width:100%;
   height:calc(100% + var(--bar));
   border:0;
   display:block;
   background:#f5f5f5;
 }

 /* 载入中 */
 .loading{
   position:fixed;inset:0;z-index:5;background:var(--brand);color:#fff;
   display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
   font-size:15px;transition:opacity .35s;
 }
 .loading.hide{opacity:0;pointer-events:none}
 .spinner{
   width:34px;height:34px;border:3px solid rgba(255,255,255,.3);
   border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;
 }
 @keyframes spin{to{transform:rotate(360deg)}}

 /* 离线提示条 */
 #offline{
   display:none;position:fixed;left:0;right:0;bottom:0;z-index:10;
   background:#c62828;color:#fff;text-align:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom));
   font-size:13px;font-weight:600;
 }
</style>
</head>
<body>

<div class="wrap">
  <iframe id="app" src="about:blank" allow="clipboard-write"></iframe>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div id="loadTxt">载入中… / Loading…</div>
</div>

<div id="offline">⚠️ 离线中，请连上网路 / Offline — 连上网后自动恢复</div>

<script>
/* =========================================================
   ★★ 只需要改下面这两行 ★★
   把 PASTE_... 换成你 Apps Script 部署后的网址（exec 结尾）
   司机端: https://script.google.com/macros/s/XXXX/exec?page=driver
   后台  : https://script.google.com/macros/s/XXXX/exec?page=admin
   ========================================================= */
var APPS = {
  driver: 'https://script.google.com/macros/s/AKfycbxE1AWCLdmK0IVETtzpC5ucXXX5eB8gMJJROFdgsPXVgcH9DbjO0W7P8J2wf1qWOnyx/exec?page=driver',   /* ← 司机端（?page=driver） */
  admin:  'https://script.google.com/macros/s/AKfycbxE1AWCLdmK0IVETtzpC5ucXXX5eB8gMJJROFdgsPXVgcH9DbjO0W7P8J2wf1qWOnyx/exec?page=admin'     /* ← 后台（?page=admin），可留空 */
};

/* 网址带 ?p=admin 就开后台，默认司机端 */
var mPage = (location.search.match(/[?&]p=(\w+)/) || [])[1] || 'driver';
var APP_URL = (APPS[mPage] && APPS[mPage].indexOf('PASTE_') !== 0) ? APPS[mPage] : APPS.driver;

/* 提示条高度微调：网址后加 ?bar=70 可实时试出最合适的数字 */
(function(){
  var b = (location.search.match(/[?&]bar=(\d+)/) || [])[1];
  if(b) document.documentElement.style.setProperty('--bar', b + 'px');
})();

var f = document.getElementById('app');
var l = document.getElementById('loading');
var loadTxt = document.getElementById('loadTxt');

if(APP_URL.indexOf('PASTE_') === 0){
  loadTxt.innerHTML = '⚠️ 还没填 Apps Script 网址<br><span style="font-size:13px;opacity:.85">用记事本打开 index.html，改 APPS 那两行</span>';
  document.querySelector('.spinner').style.display = 'none';
} else {
  f.src = APP_URL;
  f.onload = function(){
    l.classList.add('hide');
    setTimeout(function(){ l.style.display = 'none'; }, 400);
  };
  f.onerror = function(){
    document.querySelector('.spinner').style.display = 'none';
    loadTxt.textContent = '⚠️ 载入失败，请检查网络 / Failed to load';
  };
}

/* 离线 / 恢复提示 */
function upd(){
  document.getElementById('offline').style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online', upd);
window.addEventListener('offline', upd);
upd();

/* 注册 Service Worker（离线也能打开外壳页面） */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('SW fail', e); });
  });
}
</script>
</body>
</html>
